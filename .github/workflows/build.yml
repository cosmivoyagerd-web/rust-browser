name: Build Rust Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Create project directories
        run: |
          mkdir -p app/src/main/java/com/example/rustbrowser
          mkdir -p app/src/main/jniLibs
          mkdir -p rust-core/src

      - name: Create Gradle configuration
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'RustBrowser'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.rustbrowser'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.rustbrowser'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '1.2'
              }
          }
          EOF

      - name: Create Android manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Rust Browser"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create browser interface
        run: |
          cat > app/src/main/java/com/example/rustbrowser/MainActivity.java <<'EOF'
          package com.example.rustbrowser;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.inputmethod.EditorInfo;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;
          import android.webkit.*;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;

          public class MainActivity extends Activity {

              private WebView web;
              private EditText address;
              private Button backButton;
              private Button forwardButton;
              private TextView loadingText;
              private ProgressBar progress;
              private SharedPreferences storage;

              private final int background = Color.rgb(15, 20, 30);
              private final int surface = Color.rgb(27, 35, 49);
              private final int accent = Color.rgb(65, 130, 255);
              private final int primaryText = Color.rgb(240, 244, 250);
              private final int secondaryText = Color.rgb(155, 170, 190);

              static {
                  System.loadLibrary("browser_core");
              }

              public native String rustVersion();

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  storage = getSharedPreferences("browser_data", MODE_PRIVATE);

                  getWindow().setStatusBarColor(background);
                  getWindow().setNavigationBarColor(background);
                  getWindow().getDecorView().setSystemUiVisibility(0);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(background);

                  // TOP BAR
                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.VERTICAL);
                  top.setPadding(dp(14), dp(10), dp(14), dp(8));
                  top.setBackgroundColor(background);

                  LinearLayout brandRow = new LinearLayout(this);
                  brandRow.setGravity(Gravity.CENTER_VERTICAL);

                  TextView logo = new TextView(this);
                  logo.setText("◈");
                  logo.setTextColor(accent);
                  logo.setTextSize(25);
                  logo.setTypeface(null, Typeface.BOLD);

                  TextView brand = new TextView(this);
                  brand.setText("  RUST BROWSER");
                  brand.setTextColor(primaryText);
                  brand.setTextSize(14);
                  brand.setTypeface(null, Typeface.BOLD);
                  brand.setLetterSpacing(0.08f);

                  TextView version = new TextView(this);
                  version.setText("1.2");
                  version.setTextColor(secondaryText);
                  version.setTextSize(11);
                  version.setPadding(dp(8), 0, 0, 0);

                  brandRow.addView(logo);
                  brandRow.addView(brand);
                  brandRow.addView(version);

                  // ADDRESS BAR
                  LinearLayout addressBar = new LinearLayout(this);
                  addressBar.setGravity(Gravity.CENTER_VERTICAL);
                  addressBar.setPadding(dp(12), 0, dp(5), 0);
                  addressBar.setBackground(rounded(surface, 18));

                  TextView searchIcon = new TextView(this);
                  searchIcon.setText("⌕");
                  searchIcon.setTextSize(25);
                  searchIcon.setTextColor(secondaryText);
                  searchIcon.setGravity(Gravity.CENTER);

                  address = new EditText(this);
                  address.setSingleLine(true);
                  address.setTextSize(14);
                  address.setTextColor(primaryText);
                  address.setHintTextColor(secondaryText);
                  address.setHint("Search or enter address");
                  address.setBackgroundColor(Color.TRANSPARENT);
                  address.setPadding(dp(8), dp(12), dp(4), dp(12));
                  address.setImeOptions(EditorInfo.IME_ACTION_GO);

                  Button go = new Button(this);
                  go.setText("GO");
                  go.setTextColor(Color.WHITE);
                  go.setTextSize(11);
                  go.setAllCaps(false);
                  go.setBackground(rounded(accent, 14));

                  LinearLayout.LayoutParams goParams =
                      new LinearLayout.LayoutParams(dp(48), dp(42));
                  goParams.setMargins(dp(4), dp(4), dp(4), dp(4));

                  addressBar.addView(searchIcon,
                      new LinearLayout.LayoutParams(dp(25), -1));

                  addressBar.addView(address,
                      new LinearLayout.LayoutParams(0, -2, 1));

                  addressBar.addView(go, goParams);

                  // LOADING BAR
                  progress = new ProgressBar(this, null,
                      android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  progress.setProgressTintList(
                      android.content.res.ColorStateList.valueOf(accent));
                  progress.setVisibility(View.GONE);

                  loadingText = new TextView(this);
                  loadingText.setTextColor(secondaryText);
                  loadingText.setTextSize(10);
                  loadingText.setPadding(dp(3), dp(4), 0, 0);
                  loadingText.setText("Ready");

                  top.addView(brandRow);

                  LinearLayout.LayoutParams addressParams =
                      new LinearLayout.LayoutParams(-1, dp(50));
                  addressParams.setMargins(0, dp(12), 0, dp(4));

                  top.addView(addressBar, addressParams);
                  top.addView(progress,
                      new LinearLayout.LayoutParams(-1, dp(3)));
                  top.addView(loadingText);

                  // WEBVIEW
                  web = new WebView(this);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.setBackgroundColor(Color.WHITE);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url,
                                                android.graphics.Bitmap favicon) {
                          progress.setVisibility(View.VISIBLE);
                          progress.setProgress(0);
                          loadingText.setText("Loading page...");
                          address.setText(url);
                          updateNavigationButtons();
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          address.setText(url);
                          saveHistory(view.getTitle(), url);
                          loadingText.setText("Page loaded");
                          progress.setVisibility(View.GONE);
                          updateNavigationButtons();
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int value) {
                          progress.setProgress(value);

                          if (value >= 100) {
                              progress.setVisibility(View.GONE);
                          } else {
                              progress.setVisibility(View.VISIBLE);
                          }
                      }
                  });

                  // BOTTOM NAVIGATION
                  LinearLayout bottom = new LinearLayout(this);
                  bottom.setGravity(Gravity.CENTER);
                  bottom.setPadding(dp(5), dp(5), dp(5), dp(7));
                  bottom.setBackgroundColor(surface);

                  backButton = navButton("‹", "Back");
                  forwardButton = navButton("›", "Forward");

                  Button homeButton = navButton("⌂", "Home");
                  Button menuButton = navButton("☰", "Menu");

                  bottom.addView(backButton,
                      new LinearLayout.LayoutParams(0, dp(58), 1));
                  bottom.addView(forwardButton,
                      new LinearLayout.LayoutParams(0, dp(58), 1));
                  bottom.addView(homeButton,
                      new LinearLayout.LayoutParams(0, dp(58), 1));
                  bottom.addView(menuButton,
                      new LinearLayout.LayoutParams(0, dp(58), 1));

                  root.addView(top);

                  root.addView(web,
                      new LinearLayout.LayoutParams(-1, 0, 1));

                  root.addView(bottom);

                  setContentView(root);

                  go.setOnClickListener(v -> openPage());

                  address.setOnEditorActionListener((v, action, event) -> {
                      if (action == EditorInfo.IME_ACTION_GO ||
                          action == EditorInfo.IME_ACTION_DONE) {
                          openPage();
                          return true;
                      }
                      return false;
                  });

                  backButton.setOnClickListener(v -> {
                      if (web.canGoBack()) web.goBack();
                  });

                  forwardButton.setOnClickListener(v -> {
                      if (web.canGoForward()) web.goForward();
                  });

                  homeButton.setOnClickListener(v -> openHome());
                  menuButton.setOnClickListener(v -> showMenu());

                  web.loadUrl("https://www.google.com");
                  updateNavigationButtons();
              }

              private int dp(float value) {
                  return (int) (value * getResources()
                      .getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable rounded(int color, int radius) {
                  GradientDrawable shape = new GradientDrawable();
                  shape.setColor(color);
                  shape.setCornerRadius(dp(radius));
                  return shape;
              }

              private Button navButton(String icon, String label) {
                  Button button = new Button(this);
                  button.setText(icon + "\n" + label);
                  button.setTextSize(12);
                  button.setTextColor(primaryText);
                  button.setAllCaps(false);
                  button.setGravity(Gravity.CENTER);
                  button.setBackgroundColor(Color.TRANSPARENT);
                  button.setPadding(0, 0, 0, 0);
                  return button;
              }

              private void openHome() {
                  web.loadUrl("https://www.google.com");
              }

              private void openPage() {
                  String input = address.getText().toString().trim();

                  if (input.isEmpty()) return;

                  String url;

                  if (input.matches("^[a-zA-Z][a-zA-Z0-9+.-]*://.*")) {
                      url = input;
                  } else if (input.contains(".") && !input.contains(" ")) {
                      url = "https://" + input;
                  } else {
                      url = "https://www.google.com/search?q=" +
                          android.net.Uri.encode(input);
                  }

                  web.loadUrl(url);
              }

              private void updateNavigationButtons() {
                  if (web == null || backButton == null) return;

                  backButton.setEnabled(web.canGoBack());
                  forwardButton.setEnabled(web.canGoForward());

                  backButton.setAlpha(web.canGoBack() ? 1f : 0.35f);
                  forwardButton.setAlpha(web.canGoForward() ? 1f : 0.35f);
              }

              private JSONArray readList(String key) {
                  try {
                      return new JSONArray(storage.getString(key, "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              private void saveList(String key, JSONArray list) {
                  storage.edit().putString(key, list.toString()).apply();
              }

              private void saveHistory(String title, String url) {
                  if (url == null || url.isEmpty()) return;

                  JSONArray oldList = readList("history");
                  JSONArray newList = new JSONArray();

                  try {
                      JSONObject item = new JSONObject();
                      item.put("title",
                          title == null || title.isEmpty() ? url : title);
                      item.put("url", url);
                      newList.put(item);

                      for (int i = 0; i < oldList.length(); i++) {
                          JSONObject old = oldList.optJSONObject(i);

                          if (old != null &&
                              !url.equals(old.optString("url"))) {
                              newList.put(old);
                          }
                      }

                      JSONArray limited = new JSONArray();

                      for (int i = 0;
                           i < Math.min(200, newList.length()); i++) {
                          limited.put(newList.get(i));
                      }

                      saveList("history", limited);

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void saveBookmark() {
                  String url = web.getUrl();

                  if (url == null || url.isEmpty()) return;

                  JSONArray list = readList("bookmarks");

                  for (int i = 0; i < list.length(); i++) {
                      JSONObject item = list.optJSONObject(i);

                      if (item != null &&
                          url.equals(item.optString("url"))) {
                          Toast.makeText(this,
                              "Already bookmarked",
                              Toast.LENGTH_SHORT).show();
                          return;
                      }
                  }

                  try {
                      JSONObject item = new JSONObject();
                      item.put("title",
                          web.getTitle() == null ? url : web.getTitle());
                      item.put("url", url);

                      list.put(item);
                      saveList("bookmarks", list);

                      Toast.makeText(this,
                              "Bookmark saved",
                              Toast.LENGTH_SHORT).show();

                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void showMenu() {
                  String[] options = {
                      "☆  Save bookmark",
                      "★  Bookmarks",
                      "◷  History",
                      "⌂  Home",
                      "↻  Reload",
                      "ⓘ  About Rust Browser"
                  };

                  new AlertDialog.Builder(this)
                      .setTitle("Rust Browser Menu")
                      .setItems(options, (dialog, which) -> {
                          switch (which) {
                              case 0:
                                  saveBookmark();
                                  break;
                              case 1:
                                  showBookmarks();
                                  break;
                              case 2:
                                  showHistory();
                                  break;
                              case 3:
                                  openHome();
                                  break;
                              case 4:
                                  web.reload();
                                  break;
                              case 5:
                                  showAbout();
                                  break;
                          }
                      })
                      .show();
              }

              private void showBookmarks() {
                  JSONArray list = readList("bookmarks");
                  if (list.length() == 0) {
                      Toast.makeText(this, "No bookmarks", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String[] titles = new String[list.length()];
                  String[] urls = new String[list.length()];

                  try {
                      for (int i = 0; i < list.length(); i++) {
                          JSONObject item = list.getJSONObject(i);
                          titles[i] = item.getString("title");
                          urls[i] = item.getString("url");
                      }
                  } catch (Exception e) {
                      return;
                  }

                  new AlertDialog.Builder(this)
                      .setTitle("Bookmarks")
                      .setItems(titles, (dialog, which) -> web.loadUrl(urls[which]))
                      .show();
              }

              private void showHistory() {
                  JSONArray list = readList("history");
                  if (list.length() == 0) {
                      Toast.makeText(this, "No history", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  String[] titles = new String[list.length()];
                  String[] urls = new String[list.length()];

                  try {
                      for (int i = 0; i < list.length(); i++) {
                          JSONObject item = list.getJSONObject(i);
                          titles[i] = item.getString("title");
                          urls[i] = item.getString("url");
                      }
                  } catch (Exception e) {
                      return;
                  }

                  new AlertDialog.Builder(this)
                      .setTitle("History")
                      .setItems(titles, (dialog, which) -> web.loadUrl(urls[which]))
                      .show();
              }

              private void showAbout() {
                  new AlertDialog.Builder(this)
                      .setTitle("About Rust Browser")
                      .setMessage("Rust Browser v1.2\nPowered by Android WebView & Rust Core\n\nVersion: " + rustVersion())
                      .setPositiveButton("OK", null)
                      .show();
              }
          }
          EOF

      # INI BAGIAN PALING BAWAH YANG WAJIB ADA AGAR TOMBOL DOWNLOAD MUNCUL:
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-browser-apk
          path: app/build/outputs/apk/debug/app-debug.apk

